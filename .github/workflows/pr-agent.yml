# Copy to <repo>/.github/workflows/pr-agent.yml to turn on reviews for that repo.
name: pr-agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    uses: rafay99-epic/pr-review/.github/workflows/pr-agent.yml@main
    secrets:
      CMD_API_KEY: ${{ secrets.CMD_API_KEY }}
