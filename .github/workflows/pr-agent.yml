# Copy to <repo>/.github/workflows/pr-agent.yml to turn on reviews for that repo.
name: pr-agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

# Pushes to a PR cancel its stale review. Each comment gets its own group: PR-Agent's own
# replies are comments too, and a shared group would let them cancel the /review they answer.
concurrency:
  group: pr-agent-${{ github.event.pull_request.number || format('comment-{0}', github.event.comment.id) }}
  cancel-in-progress: true

jobs:
  review:
    uses: rafay99-epic/pr-review/.github/workflows/pr-agent.yml@main
    secrets:
      CMD_API_KEY: ${{ secrets.CMD_API_KEY }}
